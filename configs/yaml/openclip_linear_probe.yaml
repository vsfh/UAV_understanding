runtime:
  device: cuda
model:
  path: ./hf_cache/openclip
data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  protocols: [forward_temporal, session_disjoint, unseen_site]
  max_per_class: 250
train:
  seeds: [43]
  epochs: 20
  view: context
  prompt: definition
  batch_size: 256
  feature_batch_size: 32
  gradient_accumulation: 1
  learning_rate: 1.0e-3
  backbone_learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_workers: 4
  gradient_checkpointing: false
output:
  root: ./outputs/openclip_linear_probe/{protocol}/seed{seed}
  skip_existing: true
