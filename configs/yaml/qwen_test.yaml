runtime:
  device: cuda
model:
  path: ./hf_cache/qwen3-vl
data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  protocols: [forward_temporal, session_disjoint, unseen_site]
  split: val
  max_per_class: null
adapters:
  - name: lora
    path: ./outputs/qwen_lora/{protocol}/seed{seed}/final
    seeds: [42, 43, 44]
test:
  view: pair
  max_pixels: 262144
  max_new_tokens: 128
output:
  path: ./results/qwen/{name}/{protocol}/seed{seed}_val.json
