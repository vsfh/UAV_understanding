  - {name: incomplete_soil_cover, definition: "soil for which protective covering is visibly incomplete"}
  - {name: land_use_change, definition: "visible conversion or disturbance suggesting changed land use"}
  - {name: landscaping_construction, definition: "active construction associated with landscaping work"}
  - {name: landslide_risk, definition: "a visibly unstable slope or slide-prone area"}
  - {name: messy_green_space, definition: "a green space with visibly unmanaged clutter or waste"}
