# Compact visual definitions used by prompts and graph-negative sampling.
# Replace or extend these with the adjudicated evidence-card definitions before main runs.
events:
  - {name: abandoned_building, definition: "an apparently unused or derelict building"}
  - {name: accumulated_building_material, definition: "building material accumulated in an outdoor pile"}
  - {name: algal_bloom_scum, definition: "dense surface scum consistent with an algal bloom"}
  - {name: balloon_banner, definition: "a balloon-supported advertising banner"}
  - {name: banner, definition: "a freestanding or attached outdoor banner"}
  - {name: bare_soil_netting, definition: "exposed soil covered by dust-control netting"}
  - {name: black_odorous_water, definition: "visibly dark polluted-looking water"}
  - {name: blue_tarp_shed, definition: "a makeshift shed covered by blue tarpaulin"}
  - {name: building_damage, definition: "visible structural damage to a building"}
  - {name: building_demolition, definition: "a building undergoing active or recent demolition"}
  - {name: building_materials_factory, definition: "outdoor building-material stock at an industrial facility"}
  - {name: burning_marks_grass, definition: "burn marks visible on grass or low vegetation"}
  - {name: cargo_ship, definition: "a cargo-carrying vessel on the water"}
  - {name: collapsed_house_wall, definition: "a house wall that has visibly collapsed"}
  - {name: construction_materials, definition: "stored materials intended for construction"}
  - {name: construction_site_pile, definition: "a material pile located within a construction site"}
  - {name: construction_vehicle, definition: "a vehicle visibly used for construction work"}
  - {name: construction_waste, definition: "discarded mixed debris from construction or demolition"}
  - {name: crop_lodging, definition: "a crop area visibly flattened or lodged"}
  - {name: crowd_gathering, definition: "a concentrated gathering of people"}
  - {name: dangerous_building, definition: "a building with visible features suggesting structural danger"}
  - {name: dead_pine_tree, definition: "a pine tree with visibly dead or brown canopy"}
