  - {name: open_storage_residential, definition: "open storage of materials in a residential setting"}
  - {name: outbuilding_materials, definition: "materials associated with an outbuilding or unauthorized shed"}
  - {name: outdoor_business, definition: "commercial activity occupying an outdoor public area"}
  - {name: piled_materials_factory, definition: "piled materials located at a factory"}
  - {name: project_construction, definition: "an active general construction project"}
