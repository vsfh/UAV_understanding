experiment: table3_qwen3vl_roi_context

runtime:
  device: cuda

data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  bbox_annotations: ./um7/crop_bboxes_all_photos/crop_bboxes.json
  protocols: [session_disjoint]

model:
  family: qwen3vl
  method: lora
  repo_id: Qwen/Qwen3-VL-8B-Instruct
  revision: main
  path: ./hf_cache/qwen3-vl

representation:
  view: roi_context
  context_margin: 0.2

prompt:
  system: Classify the visible operational UAV event.
  user: >-
    The image is the GT ROI enlarged by the validation-selected context margin.
    Choose exactly one category and return only its canonical name. Categories:
    {categories}

train:
  seeds: [43]
  epochs: 5
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.0002
  warmup_ratio: 0.1
  class_balance_power: 0.5
  max_pixels: 995328
  num_workers: 12
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_scope: projector_llm

test:
  batch_size: 4
  max_pixels: 995328
  num_workers: 12
  max_new_tokens: 32

output:
  root: ./outputs/table3/qwen3vl_roi_context/{protocol}/seed{seed}
  adapter: ./outputs/table3/qwen3vl_roi_context/{protocol}/seed{seed}/best
  results: ./results/table3/qwen3vl_roi_context/{protocol}/seed{seed}_test.json
  skip_existing: true
