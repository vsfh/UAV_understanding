base_config: ./configs/yaml/qwen_ground_ms.yaml
experiment: qwen_ground_ms_v2_no_heatmap

data:
  protocols: [session_disjoint]

model:
  components:
    center_mode: query
    size_uses_heatmap: false

train:
  epochs: 8
  learning_rate: 1.5e-4
  vision_learning_rate: 1.0e-6
  heatmap_weight: 0.0

output:
  root: ./outputs/qwen_ground_ms_ablations/e8_lr1p5e4/no_heatmap/{protocol}/seed{seed}
  checkpoint: ./outputs/qwen_ground_ms_ablations/e8_lr1p5e4/no_heatmap/{protocol}/seed{seed}/last.pt
  test_results: ./results/qwen_ground_ms_ablations/e8_lr1p5e4/no_heatmap/{protocol}/seed{seed}_test.json
