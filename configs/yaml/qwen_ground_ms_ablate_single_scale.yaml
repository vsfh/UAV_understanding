base_config: ./configs/yaml/qwen_ground_ms.yaml
experiment: qwen_ground_ms_v2_single_scale

model:
  pyramid_scales: [1]

train:
  epochs: 8
  learning_rate: 1.5e-4
  vision_learning_rate: 1.0e-6

output:
