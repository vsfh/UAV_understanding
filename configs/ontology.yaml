  - {name: embankment_structure, definition: "a constructed structure along an embankment"}
  - {name: excavator, definition: "an excavator machine"}
  - {name: exposed_garbage, definition: "garbage exposed on land in the open"}
  - {name: farmland_building, definition: "a building occupying or adjoining cultivated farmland"}
  - {name: fire_lane_obstruction, definition: "objects or vehicles obstructing a marked fire lane"}
  - {name: floating_garbage, definition: "garbage floating on the water surface"}
  - {name: garbage_collection_point, definition: "a designated-looking point where garbage is collected"}
  - {name: glass_greenhouse, definition: "a greenhouse with transparent glass-like roofing"}
  - {name: grain_drying_road, definition: "grain spread across a road for drying"}
  - {name: green_algae_duckweed, definition: "green algae or duckweed covering part of the water surface"}
