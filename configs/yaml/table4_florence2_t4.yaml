experiment: table4_florence2_t4

runtime:
  device: cuda

data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  definitions: ./um7/definition.json
  bbox_annotations: ./um7/crop_bboxes_all_photos/crop_bboxes.json
  negative_label: no_event
  no_event:
    root: ./um7/no_event
    group_gap_seconds: 60
    split_ratios: {train: 0.7, val: 0.1, test: 0.2}
    seed: 43
  protocols: [session_disjoint]

model:
  family: florence2
  repo_id: florence-community/Florence-2-base-ft
  revision: main
  path: ./hf_cache/florence-2-base-ft-transformers58

prompt:
  user: >-
    Return only no_event, or one canonical category immediately followed by
    four native location tokens <loc_x1><loc_y1><loc_x2><loc_y2>. Location
    tokens range from <loc_0> to <loc_999> on the full image. Categories:
    {categories}
  open_vocab_template: "{label}: {definition}"

generation:
  route: native_discrete_location_tokens
  location_tokens: 1000
  max_new_tokens: 32
  constrained_grammar: true

train:
  recipe_version: 3
  seeds: [43]
  epochs: 10
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.00001
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  class_balance_power: 0.5
  samples_per_epoch: positive_records
  num_workers: 12

validation:
  fallback_threshold: 0.5

output:
  root: ./outputs/table4/florence2_t4/{protocol}/seed{seed}
  model: ./outputs/table4/florence2_t4/{protocol}/seed{seed}/best
  calibration: ./outputs/table4/florence2_t4/{protocol}/seed{seed}/calibration.json
  results: ./results/table4/florence2_t4/{protocol}/seed{seed}_test.json
  skip_existing: true
