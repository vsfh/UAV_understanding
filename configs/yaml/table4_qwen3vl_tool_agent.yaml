base_config: ./configs/yaml/table4_qwen3vl_t4.yaml
experiment: table4_qwen3vl_adaptive_tiling

agent:
  tile_grid: 2
  overlap: 0.1
  early_exit_threshold: 0.85
  inspect_context_margin: 0.2

output:
  root: ./outputs/table4/qwen3vl_adaptive_tiling/{protocol}/seed{seed}
  calibration: ./outputs/table4/qwen3vl_adaptive_tiling/{protocol}/seed{seed}/calibration.json
  results: ./results/table4/qwen3vl_adaptive_tiling/{protocol}/seed{seed}_test.json
  skip_existing: true
