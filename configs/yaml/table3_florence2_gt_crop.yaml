experiment: table3_florence2_gt_crop

runtime:
  device: cuda

data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  bbox_annotations: ./um7/crop_bboxes_all_photos/crop_bboxes.json
  protocols: [session_disjoint]

model:
  family: florence2
  method: full_finetune
  repo_id: microsoft/Florence-2-base-ft
  revision: main
  path: ./hf_cache/florence-2-base-ft

representation:
  view: gt_crop

prompt: >-
  Classify the event in this delivered source-resolution GT crop.
  Return only one canonical category name. Categories: {categories}

train:
  seeds: [43]
  epochs: 10
  batch_size: 8
  gradient_accumulation: 2
  learning_rate: 0.00001
  weight_decay: 0.01
  warmup_ratio: 0.1
  class_balance_power: 0.5
  num_workers: 4

test:
  batch_size: 8
  max_new_tokens: 32

output:
  root: ./outputs/table3/florence2_gt_crop/{protocol}/seed{seed}
  model: ./outputs/table3/florence2_gt_crop/{protocol}/seed{seed}/best
  results: ./results/table3/florence2_gt_crop/{protocol}/seed{seed}_test.json
  skip_existing: true
