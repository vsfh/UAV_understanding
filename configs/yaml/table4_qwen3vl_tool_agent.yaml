experiment: table4_qwen3vl_tool_agent

runtime:
  device: cuda

data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  definitions: ./um7/definition.json
  bbox_annotations: ./um7/crop_bboxes_all_photos/crop_bboxes.json
  negative_label: no_event
  no_event:
    root: ./um7/no_event
    group_gap_seconds: 60
    split_ratios: {train: 0.7, val: 0.1, test: 0.2}
    seed: 43
  protocols: [session_disjoint]

model:
  family: qwen3vl_tool_agent
  repo_id: Qwen/Qwen3-VL-8B-Instruct
  revision: main
  path: ./hf_cache/qwen3-vl

prompt:
  system: You detect operational events in aerial UAV image views.
  user: |-
    Determine whether one supported operational event is present in this view.
    Return only `no_event`, or one canonical category immediately followed by
    four location tokens <loc_x1><loc_y1><loc_x2><loc_y2>. Location tokens range
    from <loc_0> to <loc_999> on the supplied view. Categories:
    {categories}
  open_vocab_template: "{label}: {definition}"

input:
  max_pixels: 995328
  min_pixels: 65536

generation:
  route: discrete_location_tokens
  location_tokens: 1000
  max_new_tokens: 32
  constrained_grammar: true

agent:
  tile_grid: 2
  overlap: 0.1
  early_exit_threshold: 0.85
  inspect_context_margin: 0.2

train:
  recipe_version: 2
  seeds: [43]
  epochs: 5
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.1
  class_balance_power: 0.5
  samples_per_epoch: positive_records
  num_workers: 12
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_scope: projector_llm

validation:
  fallback_threshold: 0.5

output:
  root: ./outputs/table4/qwen3vl_tool_agent/{protocol}/seed{seed}
  adapter: ./outputs/table4/qwen3vl_tool_agent/{protocol}/seed{seed}/best
  calibration: ./outputs/table4/qwen3vl_tool_agent/{protocol}/seed{seed}/calibration.json
  results: ./results/table4/qwen3vl_tool_agent/{protocol}/seed{seed}_test.json
  skip_existing: true
