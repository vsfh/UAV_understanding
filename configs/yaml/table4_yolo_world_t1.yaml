experiment: table4_yolo_world_t1

runtime:
  device: cuda

data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  definitions: ./um7/definition.json
  bbox_annotations: ./um7/crop_bboxes_all_photos/crop_bboxes.json
  negative_label: no_event
  protocols: [session_disjoint]

model:
  family: yolo_world
  mode: zero_shot_validation_calibrated
  path: ./hf_cache/yolo-world/yolov8m-worldv2.pt
  url: https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8m-worldv2.pt

prompt:
  open_vocab_template: "{label}: {definition}"

train:
  seeds: [43]

inference:
  image_size: 1280
  minimum_score: 0.05

validation:
  fallback_threshold: 0.25

output:
  calibration: ./outputs/table4/yolo_world_t1/{protocol}/seed{seed}/calibration.json
  results: ./results/table4/yolo_world_t1/{protocol}/seed{seed}_test.json
