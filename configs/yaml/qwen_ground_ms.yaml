experiment: qwen_ground_single_view_highres_heatmap

runtime:
  device: cuda

model:
  path: ./hf_cache/models--Qwen--Qwen3.6-35B-A3B-FP8
  trainable_vision_blocks: 3
  pooled_long_edge: 36
  num_layers: 3
  decoder_layers: 1
  hidden_dim: 768
  num_heads: 12
  mlp_ratio: 4
  dropout: 0.1

input:
  max_pixels: 995328
  min_pixels: 65536

data:
  root: ./um7
  bbox_annotations: ./um7/crop_bboxes_all_photos/crop_bboxes.json
  protocols: [forward_temporal, session_disjoint, unseen_site]
  max_test_samples: null

train:
  seeds: [43]
  epochs: 12
  batch_size: 24
  gradient_accumulation: 2
  class_balance_power: 0.5
  samples_per_epoch: null
  learning_rate: 1.0e-4
  vision_learning_rate: 1.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  l1_weight: 5.0
  giou_weight: 2.0
  heatmap_weight: 1.0
  gradient_checkpointing: true
  num_workers: 12

test:
  batch_size: 8
  num_workers: 8

output:
  root: ./outputs/qwen_ground_single_view_highres_heatmap/{protocol}/seed{seed}
  checkpoint: ./outputs/qwen_ground_single_view_highres_heatmap/{protocol}/seed{seed}/best.pt
  test_results: ./results/qwen_ground_single_view_highres_heatmap/{protocol}/seed{seed}_test.json
  skip_existing: true
