runtime:
  device: cuda
model:
  path: ./hf_cache/openclip
data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  protocols: [forward_temporal, session_disjoint, unseen_site]
  max_per_class: 250
train:
  seeds: [42, 43, 44]
  epochs: 20
  view: context
  prompt: definition
  batch_size: 2
  feature_batch_size: 32
  gradient_accumulation: 8
  learning_rate: 5.0e-4
  backbone_learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_workers: 4
  gradient_checkpointing: true
output:
  root: ./outputs/openclip_full_finetune/{protocol}/seed{seed}
  skip_existing: true
