base_config: ./configs/yaml/qwen_ground_cls.yaml
experiment: qwen_ground_cls_v2_no_curriculum

data:
  protocols: [session_disjoint]

box_conditioning:
  enabled: false

train:
  epochs: 8
  learning_rate: 1.5e-4
  vision_learning_rate: 1.0e-6

output:
  root: ./outputs/qwen_ground_cls_ablations/e8_lr1p5e4/no_curriculum/{protocol}/seed{seed}
  checkpoint: ./outputs/qwen_ground_cls_ablations/e8_lr1p5e4/no_curriculum/{protocol}/seed{seed}/last.pt
  test_results: ./results/qwen_ground_cls_ablations/e8_lr1p5e4/no_curriculum/{protocol}/seed{seed}_test.json
