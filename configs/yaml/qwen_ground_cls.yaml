experiment: qwen_ground_cls_v2

runtime:
  device: cuda

model:
  path: ./hf_cache/models--Qwen--Qwen3.6-35B-A3B-FP8
  trainable_vision_blocks: 3
  pyramid_scales: [1, 2, 4]
  decoder_layers: 1
  hidden_dim: 768
  num_heads: 12
  mlp_ratio: 4
  dropout: 0.1
  components:
    center_mode: softargmax
    size_uses_heatmap: true

classification:
  mode: definition
  definitions: ./um7/definition.json
  text_model: ./hf_cache/openclip
  prototype_cache: ./hf_cache/qwen_ground_cls_core18_prototypes.pt
  roi_output_size: [4, 4]
  hidden_dim: 768
  dropout: 0.1
  components:
    roi: true
    global_context: true

presence:
  threshold: 0.5
  calibrate_on_val: true
  calibration_samples: 512
  max_n_fpr: 0.1
  focal_gamma: 2.0
  positive_alpha: 0.5

initialization:
  grounding_checkpoint: ./outputs/qwen_ground_ms_v2/{protocol}/seed{seed}/last.pt

box_conditioning:
  enabled: true
  gt_only_epochs: 3
  transition_epochs: 3

input:
  max_pixels: 995328
  min_pixels: 65536

data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  bbox_annotations: ./um7/crop_bboxes_all_photos/crop_bboxes.json
  no_event:
    root: ./um7/no_event
    group_gap_seconds: 60
    split_ratios: {train: 0.7, val: 0.1, test: 0.2}
    seed: 43
  protocols: [forward_temporal, session_disjoint, unseen_site]
  max_test_samples: null

train:
  seeds: [43]
  epochs: 12
  batch_size: 24
  gradient_accumulation: 2
  class_balance_power: 0.5
  negative_fraction: 0.2
  samples_per_epoch: positive_records_preserved
  learning_rate: 1.0e-4
  vision_learning_rate: 1.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  l1_weight: 5.0
  giou_weight: 2.0
  heatmap_weight: 1.0
  classification_weight: 1.0
  presence_weight: 1.0
  label_smoothing: 0.0
  gradient_checkpointing: true
  num_workers: 12

test:
  batch_size: 8
  num_workers: 8

output:
  root: ./outputs/qwen_ground_cls_v2/{protocol}/seed{seed}
  checkpoint: ./outputs/qwen_ground_cls_v2/{protocol}/seed{seed}/last.pt
  test_results: ./results/qwen_ground_cls_v2/{protocol}/seed{seed}_test.json
  skip_existing: true
