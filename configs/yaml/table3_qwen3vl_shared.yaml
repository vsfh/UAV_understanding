experiment: table3_qwen3vl_shared

runtime:
  device: cuda

data:
  root: ./um7
  ontology: ./configs/ontology.yaml
  labels: ./configs/core18_complete.txt
  bbox_annotations: ./um7/crop_bboxes_all_photos/crop_bboxes.json
  protocols: [session_disjoint]

model:
  family: qwen3vl
  method: shared_lora
  repo_id: Qwen/Qwen3-VL-8B-Instruct
  revision: main
  path: ./hf_cache/qwen3-vl

representations:
  - name: gt_crop
    view: gt_crop
    prompt:
      system: Classify the visible operational UAV event.
      user: >-
        The image is the delivered source-resolution GT crop. Choose exactly
        one category and return only its canonical name. Categories:
        {categories}

  - name: roi_context
    view: roi_context
    context_margin: 0.2
    prompt:
      system: Classify the visible operational UAV event.
      user: >-
        The image is the GT ROI enlarged by a 20 percent context margin.
        Choose exactly one category and return only its canonical name.
        Categories: {categories}

  - name: masked_background
    view: masked_background
    prompt:
      system: Classify the visible operational UAV event.
      user: >-
        Pixels outside the GT ROI are replaced by neutral gray. Classify the
        remaining event region. Choose exactly one category and return only
        its canonical name. Categories: {categories}

  - name: drawn_roi
    view: drawn_roi
    prompt:
      system: Classify the visible operational UAV event.
      user: >-
        The red rectangle marks the GT ROI in the full image. Classify only
        the marked event. Choose exactly one category and return only its
        canonical name. Categories: {categories}

  - name: coordinates
    view: coordinates
    prompt:
      system: Classify the visible operational UAV event.
      user: >-
        Use the supplied GT ROI coordinates in the full image. {coordinates}
        Classify only that region. Choose exactly one category and return only
        its canonical name. Categories: {categories}

train:
  seeds: [43]
  epochs: 5
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.1
  class_balance_power: 0.5
  samples_per_epoch: null
  max_pixels: 995328
  num_workers: 12
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_scope: projector_llm

validation:
  selection_metric: mean_macro_f1
  batch_size: 4
  max_pixels: 995328
  num_workers: 12
  max_new_tokens: 32

test:
  batch_size: 4
  max_pixels: 995328
  num_workers: 12
  max_new_tokens: 32

output:
  root: ./outputs/table3/qwen3vl_shared/{protocol}/seed{seed}
  adapter: ./outputs/table3/qwen3vl_shared/{protocol}/seed{seed}/best
  validation: ./outputs/table3/qwen3vl_shared/{protocol}/seed{seed}/validation.json
  results: ./results/table3/qwen3vl_{view}/{protocol}/seed{seed}_test.json
  skip_existing: true
